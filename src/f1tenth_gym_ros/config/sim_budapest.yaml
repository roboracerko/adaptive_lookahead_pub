# Budapest map configuration for gym_bridge
bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275

    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters (Budapest)
    map_path: 'package://f1tenth_gym_ros/maps/Budapest'

    # opponent parameters
    num_agent: 1
    max_laps: 2  # 0 = unlimited

    # ego starting pose on map (from Budapest_optimal.csv first row)
    sx: 16.091
    sy: 98.27
    stheta: 3.333

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: False
    # debug
    debug_lookahead_m: -1.0
    # Training RL
    train_rl: False
