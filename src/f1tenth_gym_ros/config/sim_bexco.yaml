bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275
    
    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters - Bexco map
    map_path: '/home/jin/ros2_prj/sim_ws/src/f1tenth_gym_ros/maps/Bexco'
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1
    max_laps: 0  # 0 = unlimited

    # ego starting pose on map (Bexco track starting point)
    # 주의: stheta는 경로 진행 방향과 일치해야 합니다 (U-turn 방지)
    # traj_race_cl.csv의 첫 번째 waypoint에서 두 번째 waypoint로의 실제 진행 방향 사용
    # First waypoint: x=-5.6888077, y=8.4725170
    # Second waypoint: x=-5.8877698, y=8.4893870
    # Starting angle: 3.061363 rad (175.40 deg)
    sx: -5.6888077
    sy: 8.4725170
    stheta: 3.057005  # traj_race_cl.csv의 첫 번째 waypoint에서 두 번째 waypoint로의 방향 (175.15 deg)

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: False
    # debug
    debug_lookahead_m: 1.0