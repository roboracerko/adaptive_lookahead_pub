evaluation:
  name: "sensitivity_tmargin_0_0"
  mode: "headless"
  laps_per_run: 3
  trials_per_driver: 10
  drivers: ["pp_adaptive"]
  timeout_s: 240
  cooldown_s: 5.0
  auto_shutdown: true
  resume_existing: false
  run_tag_prefix: "sensitivity_tmargin_0_0"
  use_realtime_visualizer: false
  fail_fast_on_collision: true
  fail_fast_on_offtrack: true
  fail_fast_on_safety_halt: true
  safety_halt_grace_s: 8.0
  output_root: "package://pp_adaptive/racelines/sensitivity/tmargin/sensitivity_tmargin_0_0"
  scenario_file: "package://f1tenth_driver_benchmark_suite/config/scenarios/budapest_map.yaml"
  raceline_path: "package://pp_adaptive/racelines/sensitivity/tmargin/sensitivity_tmargin_0_0.csv"
  metrics_common_file: "package://pp_adaptive/config/methods/benchmark_common_revision.yaml"
  pp_adaptive_config_file: "package://pp_adaptive/config/methods/sensitivity/sensitivity_tmargin_0_0.yaml"
  metrics:
    package: "f1tenth_driver_benchmark_suite"
    executable: "metrics_collector_node"
    visualizer_package: "f1tenth_driver_benchmark_suite"
    visualizer_executable: "realtime_visualizer"
