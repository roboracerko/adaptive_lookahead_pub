evaluation:
  name: "curv_spielberg"
  mode: "headless"

  laps_per_run: 3
  trials_per_driver: 30
  drivers: ["pp_adaptive"]

  timeout_s: 180
  cooldown_s: 5.0
  auto_shutdown: true
  resume_existing: false
  run_tag_prefix: "curv_spielberg"
  use_realtime_visualizer: false

  fail_fast_on_collision: true
  fail_fast_on_offtrack: true
  fail_fast_on_safety_halt: true
  safety_halt_grace_s: 8.0

  output_root: "/tmp/adaptive_lookahead_review/revision/curv/spielberg"

  scenario_file: "package://f1tenth_driver_benchmark_suite/config/scenarios/spielberg.yaml"
  raceline_path: "package://pp_adaptive/racelines/Spielberg_optimal_rl_curv.csv"
  metrics_common_file: "package://pp_adaptive/config/methods/benchmark_common_revision.yaml"

  pp_adaptive_config_file: "package://pp_adaptive/config/methods/pure_pursuit_curv_spielberg.yaml"

  metrics:
    package: "f1tenth_driver_benchmark_suite"
    executable: "metrics_collector_node"
    visualizer_package: "f1tenth_driver_benchmark_suite"
    visualizer_executable: "realtime_visualizer"
