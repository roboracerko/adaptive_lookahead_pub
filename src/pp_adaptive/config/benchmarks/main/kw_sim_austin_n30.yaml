evaluation:
  name: "kw_sim_austin"
  mode: "headless"

  laps_per_run: 3
  trials_per_driver: 30
  drivers: ["pp_adaptive"]

  timeout_s: 200
  cooldown_s: 5.0
  auto_shutdown: true
  resume_existing: true
  run_tag_prefix: "kw_sim_austin"
  use_realtime_visualizer: false

  fail_fast_on_collision: true
  fail_fast_on_offtrack: true
  fail_fast_on_safety_halt: true
  safety_halt_grace_s: 8.0

  output_root: "/tmp/f1tenth_eval/ablation/kw_sim/austin"

  scenario_file: "package://f1tenth_driver_benchmark_suite/config/scenarios/austin_map.yaml"
  raceline_path: "package://pp_adaptive/racelines/Austin_map_optimal_rl_kw_sim.csv"
  metrics_common_file: "package://f1tenth_driver_benchmark_suite/config/benchmark_common.yaml"

  pp_adaptive_config_file: "package://pp_adaptive/config/benchmarks/ablation/pure_pursuit_kw_sim_austin.yaml"

  metrics:
    package: "f1tenth_driver_benchmark_suite"
    executable: "metrics_collector_node"
    visualizer_package: "f1tenth_driver_benchmark_suite"
    visualizer_executable: "realtime_visualizer"
