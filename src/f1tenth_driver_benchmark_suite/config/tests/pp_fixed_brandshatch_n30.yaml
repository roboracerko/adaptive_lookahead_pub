evaluation:
  name: "pp_fixed_brandshatch_n30"
  mode: "headless"

  laps_per_run: 3
  trials_per_driver: 30
  drivers: ["pp_fixed"]

  timeout_s: 180
  cooldown_s: 5.0
  auto_shutdown: true
  run_tag_prefix: "pp_fixed_brandshatch_n30"
  use_realtime_visualizer: false

  fail_fast_on_collision: true
  fail_fast_on_offtrack: true
  fail_fast_on_safety_halt: true
  safety_halt_grace_s: 8.0

  output_root: "/tmp/f1tenth_eval/pp_fixed/brandshatch"

  scenario_file: "package://f1tenth_driver_benchmark_suite/config/scenarios/brandshatch.yaml"
  raceline_path: "package://pp_adaptive/racelines/BrandsHatch_map_optimal_rl.csv"
  metrics_common_file: "package://f1tenth_driver_benchmark_suite/config/benchmark_common.yaml"

  pp_fixed_config_file: "package://pp_core/config/pure_pursuit_benchmark.yaml"

  metrics:
    package: "f1tenth_driver_benchmark_suite"
    executable: "metrics_collector_node"
    visualizer_package: "f1tenth_driver_benchmark_suite"
    visualizer_executable: "realtime_visualizer"
