evaluation:
  name: "alg1_org_spielberg_n30"
  mode: "headless"

  laps_per_run: 3
  trials_per_driver: 30
  drivers: ["pp_adaptive"]

  timeout_s: 300
  cooldown_s: 5.0
  auto_shutdown: true
  run_tag_prefix: "alg1_org_spielberg_n30"
  use_realtime_visualizer: false

  fail_fast_on_collision: true
  fail_fast_on_offtrack: true
  fail_fast_on_safety_halt: true
  safety_halt_grace_s: 8.0

  output_root: "/tmp/f1tenth_eval/alg1_org_spielberg/spielberg"

  scenario_file: "package://f1tenth_driver_benchmark_suite/config/scenarios/spielberg.yaml"
  raceline_path: "package://pp_adaptive/racelines/Spielberg_optimal_rl_alg1_org.csv"
  metrics_common_file: "package://f1tenth_driver_benchmark_suite/config/benchmark_alg1_org.yaml"

  pp_adaptive_config_file: "package://pp_adaptive/config/pure_pursuit_alg1_org_spielberg.yaml"

  metrics:
    package: "f1tenth_driver_benchmark_suite"
    executable: "metrics_collector_node"
    visualizer_package: "f1tenth_driver_benchmark_suite"
    visualizer_executable: "realtime_visualizer"
